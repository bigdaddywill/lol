name: Ghost Swarm Smoke

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: "Smoke Agent ${{ matrix.id }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - id: "1"
            role: "architect"
          - id: "2"
            role: "critic"
    steps:
      - name: Inspect runner
        env:
          ID: ${{ matrix.id }}
          ROLE: ${{ matrix.role }}
        run: |
          echo "agent=$ID role=$ROLE"
          nproc
          free -h
