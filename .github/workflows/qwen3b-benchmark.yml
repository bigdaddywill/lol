name: Qwen 3B Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Show runner specs
        run: |
          echo '=== RUNNER ==='
          nproc
          free -h
          lscpu | sed -n '1,35p'

      - name: Download prebuilt llama.cpp
        run: |
          curl -L --fail --retry 3 -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10976/llama-b10976-bin-ubuntu-x64.tar.gz
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          LLAMA_CLI=$(find llama -type f -name llama-cli -perm -111 | head -n 1)
          test -n "$LLAMA_CLI"
          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"
          "$LLAMA_CLI" --version

      - name: Reasoning benchmark
        run: |
          mkdir -p results
          "$LLAMA_CLI" \
            -hf Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M \
            -st \
            -t 2 \
            -n 512 \
            --temp 0.2 \
            --top-p 0.9 \
            -p 'You are participating in a serious reasoning benchmark. Solve this carefully. A farmer has 17 sheep. All but 9 die. How many sheep remain? Explain the trick, then give the final answer.' \
            2>&1 | tee results/qwen3_reasoning.txt

      - name: Coding benchmark
        run: |
          "$LLAMA_CLI" \
            -hf Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M \
            -st \
            -t 2 \
            -n 512 \
            --temp 0.2 \
            --top-p 0.9 \
            -p 'Write a Python function called dedupe_preserve_order(items) that removes duplicates while preserving first-seen order. Explain its time complexity and provide a minimal example. Return only the explanation, code, and example.' \
            2>&1 | tee results/qwen3_coding.txt

      - name: Hard reasoning benchmark
        run: |
          "$LLAMA_CLI" \
            -hf Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M \
            -st \
            -t 2 \
            -n 768 \
            --temp 0.2 \
            --top-p 0.9 \
            -p 'Three boxes are labeled APPLES, ORANGES, and APPLES+ORANGES. Every label is wrong. You may draw exactly one fruit from exactly one box without looking inside. Which box should you draw from, and how can you correctly relabel all three boxes? Explain step by step and check your own reasoning.' \
            2>&1 | tee results/qwen3_logic.txt

      - name: Adversarial reasoning benchmark
        run: |
          "$LLAMA_CLI" \
            -hf Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M \
            -st \
            -t 2 \
            -n 768 \
            --temp 0.2 \
            --top-p 0.9 \
            -p 'A bat and a ball cost $1.10 total. The bat costs $1.00 more than the ball. How much does the ball cost? Do not guess; derive the answer algebraically and explain why the obvious answer is wrong.' \
            2>&1 | tee results/qwen3_adversarial.txt

      - name: Summarize
        run: |
          echo '=== BENCHMARK SUMMARY ==='
          grep -E 'Prompt:|Generation:|t/s|tokens per second' results/*.txt || true
          ls -lh results

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: qwen-3b-benchmark
          path: results/
          retention-days: 7
