name: Ghost Swarm — 20 Local AI Agents

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    name: "Agent ${{ matrix.id }} — ${{ matrix.role }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - { id: "01", role: "systems-architect" }
          - { id: "02", role: "distributed-systems" }
          - { id: "03", role: "benchmark-scientist" }
          - { id: "04", role: "model-researcher" }
          - { id: "05", role: "optimization-engineer" }
          - { id: "06", role: "adversarial-critic" }
          - { id: "07", role: "red-team" }
          - { id: "08", role: "software-architect" }
          - { id: "09", role: "ai-agent-designer" }
          - { id: "10", role: "economics-analyst" }
          - { id: "11", role: "performance-engineer" }
          - { id: "12", role: "reliability-engineer" }
          - { id: "13", role: "creative-strategist" }
          - { id: "14", role: "security-reviewer" }
          - { id: "15", role: "coding-agent" }
          - { id: "16", role: "research-agent" }
          - { id: "17", role: "swarm-coordinator" }
          - { id: "18", role: "bottleneck-hunter" }
          - { id: "19", role: "contrarian" }
          - { id: "20", role: "final-planner" }

    steps:
      - name: Inspect runner
        env:
          ID: ${{ matrix.id }}
          ROLE: ${{ matrix.role }}
        run: |
          echo "=== AGENT $ID ==="
          echo "ROLE=$ROLE"
          echo "CPU=$(nproc)"
          free -h
          lscpu | grep -E 'Model name|CPU\(s\)|Core\(s\)|Thread\(s\) per core' || true

      - name: Download llama.cpp
        run: |
          curl -L --fail --retry 3 -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10976/llama-b10976-bin-ubuntu-x64.tar.gz
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          LLAMA_CLI=$(find llama -type f -name llama-cli -perm -111 | head -n 1)
          test -n "$LLAMA_CLI"
          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"
          "$LLAMA_CLI" --version

      - name: Run local agent
        env:
          ID: ${{ matrix.id }}
          ROLE: ${{ matrix.role }}
        run: |
          mkdir -p results
          if [ "$((10#$ID % 2))" -eq 0 ]; then
            MODEL='Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M'
          else
            MODEL='Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M'
          fi

          PROMPT=$(cat <<EOF
You are Agent $ID in a 20-agent local AI swarm.
Your assigned role is: $ROLE.

Mission:
Find the strongest legitimate architecture for doing useful AI work with free standard GitHub-hosted runners in public repositories, respecting GitHub's documented limits.

We already verified that a standard public runner provides a fresh 4-CPU, roughly 16-GB RAM Linux VM and can run GGUF models with llama.cpp entirely on CPU.

Think independently from your role. Do not repeat generic advice. Produce exactly:
1. Best idea
2. Best next experiment
3. Hidden bottleneck
4. Best multi-agent cooperation mechanism
5. Concrete implementation sketch

Be concise, technical, and skeptical.
EOF
)

          "$LLAMA_CLI" \
            -hf "$MODEL" \
            -st \
            -t 2 \
            -n 300 \
            --temp 0.3 \
            --top-p 0.9 \
            -p "$PROMPT" \
            2>&1 | tee "results/agent_${ID}.txt"

      - name: Upload agent report
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.id }}
          path: results/agent_${{ matrix.id }}.txt
          retention-days: 1

  judge:
    name: Swarm Judge
    needs: agent
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download agent reports
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: swarm-reports

      - name: Download llama.cpp
        run: |
          curl -L --fail --retry 3 -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10976/llama-b10976-bin-ubuntu-x64.tar.gz
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          LLAMA_CLI=$(find llama -type f -name llama-cli -perm -111 | head -n 1)
          test -n "$LLAMA_CLI"
          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

      - name: Synthesize swarm
        run: |
          find swarm-reports -type f -name 'agent_*.txt' -print0 | xargs -0 cat > combined_agents.txt
          mkdir -p results

          PROMPT=$(cat <<'EOF'
You are the judge of a 20-agent local AI swarm.

Below are independent reports from agents with different roles.

Synthesize a practical Swarm v2 architecture.

Return:
1. Five strongest ideas, deduplicated.
2. Three biggest real bottlenecks.
3. The best division of labor between small and larger local models.
4. A concrete data-flow design for agent-to-agent cooperation.
5. One benchmark that can prove cooperation beats independent agents.
6. One unconventional experiment worth running next.

Separate measured facts from proposals. Avoid hype.

AGENT REPORTS:
EOF
)
          PROMPT="$PROMPT$(cat combined_agents.txt)"

          "$LLAMA_CLI" \
            -hf 'Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M' \
            -st \
            -t 4 \
            -n 1200 \
            --temp 0.2 \
            --top-p 0.9 \
            -p "$PROMPT" \
            2>&1 | tee results/swarm_judge.txt

      - name: Upload swarm result
        uses: actions/upload-artifact@v4
        with:
          name: ghost-swarm-v1-results
          path: |
            swarm-reports/
            results/
          retention-days: 7
