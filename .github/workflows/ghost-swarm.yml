name: Ghost Swarm — 20 AI Agents

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm:
    name: "Agent ${{ matrix.id }} — ${{ matrix.role }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - id: "01"
            role: "systems-architect"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "02"
            role: "distributed-systems"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "03"
            role: "benchmark-scientist"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "04"
            role: "model-researcher"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "05"
            role: "optimization-engineer"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "06"
            role: "adversarial-critic"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "07"
            role: "red-team"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "08"
            role: "software-architect"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "09"
            role: "ai-agent-designer"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "10"
            role: "economics-analyst"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "11"
            role: "performance-engineer"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "12"
            role: "reliability-engineer"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "13"
            role: "creative-strategist"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "14"
            role: "security-reviewer"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "15"
            role: "coding-agent"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "16"
            role: "research-agent"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "17"
            role: "swarm-coordinator"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "18"
            role: "bottleneck-hunter"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
          - id: "19"
            role: "contrarian"
            model: "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M"
          - id: "20"
            role: "final-planner"
            model: "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"

    steps:
      - name: Show actual machine
        run: |
          echo "=== GHOST SWARM AGENT ${{ matrix.id }} ==="
          echo "ROLE=${{ matrix.role }}"
          echo "MODEL=${{ matrix.model }}"
          echo "CPU=$(nproc)"
          free -h
          lscpu | grep -E 'Model name|CPU\(s\)|Core\(s\)|Thread\(s\) per core' || true

      - name: Download llama.cpp
        run: |
          curl -L --fail --retry 3 -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10976/llama-b10976-bin-ubuntu-x64.tar.gz
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          LLAMA_CLI=$(find llama -type f -name llama-cli -perm -111 | head -n 1)
          test -n "$LLAMA_CLI"
          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

      - name: Run local AI agent
        env:
          MODEL: ${{ matrix.model }}
          ROLE: ${{ matrix.role }}
          ID: ${{ matrix.id }}
        run: |
          mkdir -p results
          PROMPT=$(cat <<EOF
You are Agent $ID in a 20-agent distributed AI research swarm.
Your role: $ROLE.

Mission:
Design the strongest legitimate architecture for getting useful AI work done with free standard GitHub-hosted runners in public repositories, while respecting GitHub's published limits and avoiding abuse.

We have observed that a standard public runner gives us a fresh Linux VM with 4 CPU and about 16 GiB RAM, and that local GGUF models can run entirely CPU-only with llama.cpp.

Think independently. Attack the mission from your role's perspective.
Give exactly:
1. The single most valuable idea you discovered.
2. One concrete experiment we should run next.
3. The biggest bottleneck or hidden constraint.
4. One way multiple agents could cooperate rather than merely run in parallel.
5. A compact implementation sketch.

Do not praise the mission. Do not assume unlimited concurrency. Be specific and technically creative.
EOF
)
          "$LLAMA_CLI" -hf "$MODEL" -st -t 2 -n 256 --temp 0.3 --top-p 0.9 -p "$PROMPT" 2>&1 | tee "results/agent_${ID}.txt"

      - name: Upload agent report
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.id }}
          path: results/agent_${{ matrix.id }}.txt
          retention-days: 1

  judge:
    name: Swarm Judge
    needs: swarm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all agent reports
        uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          path: swarm-reports
          merge-multiple: true

      - name: Download llama.cpp
        run: |
          curl -L --fail --retry 3 -o llama.tar.gz https://github.com/ggml-org/llama.cpp/releases/download/b10976/llama-b10976-bin-ubuntu-x64.tar.gz
          mkdir llama
          tar -xzf llama.tar.gz -C llama
          LLAMA_CLI=$(find llama -type f -name llama-cli -perm -111 | head -n 1)
          test -n "$LLAMA_CLI"
          echo "LLAMA_CLI=$LLAMA_CLI" >> "$GITHUB_ENV"

      - name: Synthesize the swarm
        run: |
          cat swarm-reports/agent_*.txt > combined_agents.txt
          mkdir -p results
          PROMPT=$(cat <<'EOF'
You are the judge of a 20-agent AI swarm.

Below are reports from independent agents who were asked to design the strongest legitimate way to use free public GitHub Actions runners for useful AI work.

Synthesize them into a concrete next-generation architecture.

Your response must contain:
1. The 5 strongest ideas, deduplicated.
2. The 3 biggest real bottlenecks.
3. A proposed "Swarm v2" design with explicit job roles and data flow.
4. A benchmark that would objectively test whether Swarm v2 is better than simply running agents independently.
5. One clever experiment we have not already tried.

Separate observations from speculation. Prefer implementable designs over hype.

AGENT REPORTS:
EOF
          )
          PROMPT="$PROMPT$(cat combined_agents.txt)"
          "$LLAMA_CLI" -hf "Qwen/Qwen2.5-3B-Instruct-GGUF:Q4_K_M" -st -t 4 -n 1024 --temp 0.2 --top-p 0.9 -p "$PROMPT" 2>&1 | tee results/swarm_judge.txt

      - name: Upload swarm synthesis
        uses: actions/upload-artifact@v4
        with:
          name: ghost-swarm-v1-results
          path: |
            swarm-reports/
            results/
          retention-days: 7
