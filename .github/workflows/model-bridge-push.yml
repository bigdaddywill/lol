name: Model Bridge Probe

on:
  push:
    paths:
      - '.github/workflows/model-bridge-push.yml'

concurrency:
  group: model-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Download model and llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          model_url='https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true'
          llama_url='https://github.com/ggml-org/llama.cpp/releases/download/b10976/llama-b10976-bin-ubuntu-x64.tar.gz'
          curl -L --fail --retry 3 --retry-all-errors -o qwen2.5-0.5b-instruct-q4_k_m.gguf "$model_url"
          curl -L --fail --retry 3 --retry-all-errors -o llama.tar.gz "$llama_url"
          mkdir llama-runtime
          tar -xzf llama.tar.gz -C llama-runtime
          server=$(find llama-runtime -type f -name llama-server -perm -111 | head -n 1)
          test -n "$server"
          sha256sum qwen2.5-0.5b-instruct-q4_k_m.gguf | tee sha256.txt
          find llama-runtime -type f -exec sha256sum {} \; >> sha256.txt
          echo '--- runtime size ---'
          du -sh llama-runtime
          echo '--- runtime files ---'
          find llama-runtime -type f -maxdepth 4 -printf '%p %s bytes\n' | head -100
      - name: Upload bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: qwen-0.5b-local-inference-runtime
          path: |
            qwen2.5-0.5b-instruct-q4_k_m.gguf
            llama-runtime/
            sha256.txt
          compression-level: 0
          retention-days: 1
